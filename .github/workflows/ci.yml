name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Cierre 5 de D2: la pasada nocturna de los mutantes de la guardia con el spec ENTERO por mutante (`--full`).
  schedule:
    - cron: '17 3 * * *'

# Tres trabajos, tres preguntas distintas. La matriz original las confundía:
# corría la SUITE en Node 20/22/24, pero el ejecutor de tests
# (@poppinss/ts-exec) declara `engines: node >=24`, así que en 20 y 22 moría
# con ERR_UNKNOWN_FILE_EXTENSION antes del primer test.
jobs:
  # ¿Se cumple la semántica? El juez, contra el driver por defecto.
  # `npm test` incluye `check:purity`: un alias del consumidor en `src/` o un
  # módulo acoplado al manager rompen este job, no solo el build.
  test:
    # Cierre 6 de D2: el `schedule` nocturno lanza SOLO `guard-mutants-full`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # La suite de contrato corre sobre SQLite en memoria: sin servicios,
      # sin migraciones y sin depender del proyecto consumidor.
      - run: npm test
      # Y sobre SQLite en fichero con pool 2..5 (2.5-B · K10): es el modo que
      # el README promete como «concurrencia real a nivel de conexión» y no
      # estaba en ningún job.
      - run: npm run test:sqlite-file

  # El MISMO juez contra OpenFGA. Va aparte porque necesita el servidor: si
  # este job cae, lo que falla es el driver externo, no el motor.
  #
  # Dos servidores: uno con los defaults y otro con el tope de resultados de
  # ListObjects/ListUsers en 3. El driver enumera con `Read` paginado (L0.7),
  # que no tiene tope: el segundo servidor es la prueba de que ninguna
  # enumeración depende de ese tope — el caso de 1.200 asignaciones y el de
  # los denies de ruido pasan igual contra los dos. Sin él, una vuelta a
  # ListObjects sería invisible con el default (1.000) en una suite de
  # pruebas. (Con 1 el servidor rompe otras cosas: no bajar de 3.)
  openfga:
    # Cierre 6 de D2: el `schedule` nocturno lanza SOLO `guard-mutants-full`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci

      # `services:` no admite sobrescribir el comando del contenedor y la
      # imagen de OpenFGA necesita el subcomando `run`, así que se levantan a
      # mano y se espera a que respondan.
      - name: Levantar OpenFGA (default y con MAX_RESULTS=3)
        run: |
          docker run -d --name openfga -p 8090:8080 \
            -e OPENFGA_DATASTORE_ENGINE=memory \
            openfga/openfga:v1.19.0 run
          docker run -d --name openfga-tiny -p 8091:8080 \
            -e OPENFGA_DATASTORE_ENGINE=memory \
            -e OPENFGA_LIST_OBJECTS_MAX_RESULTS=3 \
            -e OPENFGA_LIST_USERS_MAX_RESULTS=3 \
            openfga/openfga:v1.19.0 run
          for port in 8090 8091; do
            ok=0
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/healthz" > /dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "OpenFGA en :$port no respondió a tiempo"
              docker logs openfga; docker logs openfga-tiny
              exit 1
            fi
          done

      - name: Juez contra OpenFGA (defaults)
        run: npm test
        env:
          OPENFGA_TEST_URL: http://localhost:8090

      - name: Juez contra OpenFGA (MAX_RESULTS=3)
        run: npm test
        env:
          OPENFGA_TEST_URL: http://localhost:8091

  # ¿Vale lo mismo en los motores SQL que el README promete? (2.5 · J2/J5).
  # La MISMA suite —el juez con `database` y, con OpenFGA delante, también con
  # `openfga`— contra PostgreSQL 18 y MySQL 8.4, que es donde aparecieron los
  # defectos de J3 (precisión de `expires_at`, collation, tipo `uuid`, tope de
  # la CTE recursiva). Cada ejecución crea su base con sufijo aleatorio y la
  # borra al terminar. Los dos servicios se declaran en el job y la matriz
  # elige cuál se usa: `services:` no admite condicionales por matriz.
  engines:
    # Cierre 6 de D2: el `schedule` nocturno lanza SOLO `guard-mutants-full`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pg, mysql]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/authz_test
      TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/authz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci

      - name: Levantar OpenFGA
        run: |
          docker run -d --name openfga -p 8090:8080 \
            -e OPENFGA_DATASTORE_ENGINE=memory \
            openfga/openfga:v1.19.0 run
          ok=0
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8090/healthz" > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "OpenFGA en :8090 no respondió a tiempo"
            docker logs openfga
            exit 1
          fi

      - name: Juez contra ${{ matrix.engine }} (database)
        run: npm run test:${{ matrix.engine }}

      - name: Juez contra ${{ matrix.engine }} (database + openfga)
        run: npm run test:${{ matrix.engine }}
        env:
          OPENFGA_TEST_URL: http://localhost:8090

  # ¿Siguen teniendo dientes los casos de las banderas? (lote R del plan 2.5;
  # CLAUDE.md puntos 6 y 9). Por cada bandera booteada de los diez comandos se
  # deja INERTE en ejecución (el defecto de alpha.8) y se exige que algún caso
  # de kernel se ponga rojo. Un mutante vivo sin exención firmada en
  # scripts/flag_mutants.manifest.json es rojo. Sin servicios: los casos que
  # necesitaban OpenFGA (`--store-id`) se juzgan contra el stub mudo.
  flag-mutants:
    # Cierre 6 de D2: el `schedule` nocturno lanza SOLO `guard-mutants-full`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run check:flag-mutants

  # ¿Aguanta el cutover publicado en el README? (lote R; CLAUDE.md puntos 8, 9
  # y 10: criterio de estable). El runbook ejecutable recorre, por el kernel de
  # ace y con un proceso por fase, los estados antes/durante/después/abortada/
  # caducada/repetida contra un motor que otro proceso pueda abrir (pg y
  # sqlite-fichero) y un OpenFGA REAL; y afirma que cada `node ace …` del README
  # tiene su paso. Nada de skips: sin entorno es rojo (CUTOVER_RUNBOOK_REQUIRED).
  cutover-runbook:
    # Cierre 6 de D2: el `schedule` nocturno lanza SOLO `guard-mutants-full`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pg, sqlite-file]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/authz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci

      - name: Levantar OpenFGA
        run: |
          docker run -d --name openfga -p 8090:8080 \
            -e OPENFGA_DATASTORE_ENGINE=memory \
            openfga/openfga:v1.19.0 run
          ok=0
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8090/healthz" > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "OpenFGA en :8090 no respondió a tiempo"
            docker logs openfga
            exit 1
          fi

      - name: Runbook de cutover contra ${{ matrix.engine }} + OpenFGA
        run: npm run cutover-runbook
        env:
          TEST_DB: ${{ matrix.engine }}
          OPENFGA_TEST_URL: http://localhost:8090

  # ¿Es cargable lo que se publica en todo el rango que declara `engines`?
  # `tsc` compila en cualquier versión y `node --check` verifica que el
  # JavaScript emitido parsea en esa versión — que es el riesgo real (un
  # target demasiado moderno para el suelo declarado).
  compat:
    # Cierre 6 de D2: el `schedule` nocturno lanza SOLO `guard-mutants-full`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: El build es cargable en Node ${{ matrix.node }}
        run: |
          count=0
          while IFS= read -r file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find build -name '*.js')
          echo "$count ficheros emitidos verificados"
          test "$count" -gt 0

  # La guardia de superficie L1 (plan 2.5 · lote 0; CLAUDE.md punto 6) corre en `npm test` (cruce ESTÁTICO:
  # cada celda tiene mutante y cada `find` casa). Esto es la prueba DINÁMICA: cada mutante de
  # `tests/fixtures/guard_mutants.json` aplicado sobre una copia del árbol tiene que poner ROJO el caso
  # nombrado. Un mutante vivo = una guarda que ningún caso vigila. En `:memory:` y en `sqlite-file`
  # (criterio de aceptación del lote 0).
  guard-mutants:
    # Cierre 6 de D2: el `schedule` nocturno lanza SOLO `guard-mutants-full`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, sqlite-file]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Cierre 5 de D2 (G1+G2+G3 del tester del panel «óptimo»): por mutante, SOLO los casos de su `expectRed`, en
      # paralelo (un directorio por worker); los mutantes de `tuple_order.ts`/`reconcile.ts` (puros, sin SQL: veredicto
      # idéntico en los dos motores, medido una vez) solo en la pierna `sqlite`. La pasada con el spec ENTERO por
      # mutante (`--full`, da `collateral`) va en el job nocturno `guard-mutants-full`.
      - run: node scripts/check_guard_mutants.mjs --db ${{ matrix.db }} --jobs 4 ${{ matrix.db == 'sqlite-file' && '--skip-db-independent' || '' }}

  guard-mutants-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: node scripts/check_guard_mutants.mjs --full --jobs 4
